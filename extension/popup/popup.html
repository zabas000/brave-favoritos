<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Brave Favoritos Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view">
    <div class="brand">
      <div class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1>Favoritos</h1>
      <p class="tagline">Guarda y sincroniza tus marcadores</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Entrar</button>
      <button class="tab" data-tab="register">Crear cuenta</button>
    </div>

    <form id="auth-form" novalidate>
      <div id="login-fields">
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
      </div>
      <div id="register-fields" class="off">
        <input type="email" id="reg-email" placeholder="Correo electrónico">
        <input type="password" id="reg-password" placeholder="Contraseña (6+ caracteres)">
        <input type="password" id="reg-confirm" placeholder="Repetir contraseña">
      </div>
      <p id="error-msg" class="error"></p>
      <button type="submit" id="auth-btn">Entrar</button>
    </form>
  </div>

  <!-- MAIN -->
  <div id="main-view" class="off">
    <div class="topbar">
      <div class="icon-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div>
        <h2>Favoritos</h2>
        <span id="user-email" class="email"></span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="num" id="local-count">0</span>
        <span class="lbl">Local</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="num" id="cloud-count">0</span>
        <span class="lbl">Nube</span>
      </div>
    </div>

    <button id="sync-up-btn" class="btn primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Subir a la nube
    </button>

    <button id="sync-down-btn" class="btn secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Descargar de la nube
    </button>

    <div id="sync-status" class="status off"></div>

    <button id="logout-btn" class="btn ghost">Cerrar sesión</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
