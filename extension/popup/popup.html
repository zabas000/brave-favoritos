<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brave Favoritos Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div id="login-view">
      <h1>Brave Favoritos</h1>
      <p class="subtitle">Sincroniza tus marcadores</p>
      <div class="tabs">
        <button class="tab active" data-tab="login">Iniciar Sesión</button>
        <button class="tab" data-tab="register">Registrarse</button>
      </div>
      <form id="auth-form">
        <div id="login-fields">
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Contraseña" required>
        </div>
        <div id="register-fields" style="display:none">
          <input type="email" id="reg-email" placeholder="Email" required>
          <input type="password" id="reg-password" placeholder="Contraseña (mín. 6 caracteres)" required minlength="6">
          <input type="password" id="reg-confirm" placeholder="Confirmar contraseña" required>
        </div>
        <p id="error-msg" class="error"></p>
        <button type="submit" id="auth-btn">Iniciar Sesión</button>
      </form>
    </div>

    <div id="main-view" style="display:none">
      <div class="header">
        <h1>Brave Favoritos</h1>
        <span id="user-email" class="user-email"></span>
      </div>
      <div class="stats">
        <p>Marcadores locales: <strong id="local-count">0</strong></p>
        <p>Marcadores en nube: <strong id="cloud-count">0</strong></p>
      </div>
      <div class="actions">
        <button id="sync-up-btn" class="btn-primary">
          Subir a la nube
        </button>
        <button id="sync-down-btn" class="btn-secondary">
          Descargar de la nube
        </button>
      </div>
      <div id="sync-status" class="status"></div>
      <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
